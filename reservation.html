<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reservation</title>
</head>
<body>
    <h1>réserver une table</h1>
    <form>
        <fieldset>
            <label for="">nom:</label>
            <input type="text" name="nom">
            <br><br>
            <label for="">prénom:</label>
            <input type="text" name="prenom">
            <br><br>
            <label for="">Email:</label>
            <input type="email" name="email">
            <br><br>
            <label for="">téléphone</label>
            <input type="tel" name="telephone"><br><br>
            <label for="">date de réservation</label>
            <input type="date" name="date">
            <br><br>
            <label for="">heure:</label>
            <input type="time" name="heure">
            <br><br>
            <label for="">date et time</label>
            <input type="datetime-local">
            <br><br>
            <label for="">nombres des personnes:</label>
            <input type="number" name="personnes" min="1">
            <br><br>
            <label for="">choisir une table:</label>
            <select name="table">
                <option>table intérieur</option>
                <option>table extérieur</option>
            </select>
            <br><br>
            <label>remarque</label>
            <br>
            <textarea name="remarque" rows="4" cols="30"></textarea>

            <br><br>
            <input type="submit" value="réserver">
            <input type="reset" value="effacer"><br>
            <a href="index.html">retour à l'acceuil</a>
        </fieldset>

    </form>
</body>
</html>
